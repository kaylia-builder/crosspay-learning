server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/crosspay?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379

# JWT 配置
jwt:
  secret: crosspay-learning-project-jwt-secret-key-2024-minimum-256-bits-long!!
  expiration-ms: 86400000  # 24 hours

# 平台手续费默认配置
platform:
  default-fee-rate: 0.03   # 3%

# 日志
logging:
  level:
    com.crosspay: DEBUG
